 legend.innerHTML+='<br>Dotted: '+(filtered?'test unavailable':'rate unavailable');
 if(filtered)legend.innerHTML+='<br>Raw two-sided z-test; assumes independent user-months.';
 if(pin)pin.remove();
 if(isDest&&origin.value!=='total'&&data.centers[origin.value])
  pin=L.marker(data.centers[origin.value]).bindTooltip('Origin '+origin.value).addTo(map);
 features.eachLayer(layer=>{
  const zip=layer.feature.properties.zip, self=isDest&&origin.value===zip;
  let row=rows[zip];
  // An unlisted route from a known origin had zero arrivals in all three windows.
  if(!row&&key==='routes'&&!self){const n=data.origins[origin.value];
   const zero=n.map(v=>v>0?0:null), both=zero[1]===0&&zero[2]===0?0:null;
   row=[...zero,both,both,null,null,null]}
  row=row||Array(8).fill(null);
  let rate=row[rateIdx];
  if(isExcess)rate=rate==null||row[0]==null?null:rate-row[0];
  const ps=periodKey==='post'?[row[7]]:[row[5],row[6]];
  const passes=ps.some(p=>p!=null&&p<0.05);
  const missing=rate==null||self||(filtered&&!passes&&ps.some(p=>p==null));
  let color='#bdbdbd';
  if(!missing&&(!filtered||passes)){
   if(isExcess){const t=sc.cuts[0];color=sc.colors[rate< -t?0:rate<0?1:rate===0?2:rate<=t?3:4]}
   else if(isFlow){let i=0;if(rate>0){i=1;while(i<=sc.cuts.length&&rate>=sc.cuts[i-1])i++}
    color=rate>100?'#000000':sc.colors[i]}
   else {let i=0;if(rate>0){i=1;while(i<=sc.cuts.length&&rate>sc.cuts[i-1])i++}color=sc.colors[i]}
  }
  layer.setStyle({fillColor:color,color:missing?'#888':color==='#ffffff'?'#999':color,
   weight:0.7,dashArray:missing?'2 2':null,fillOpacity:missing?0:0.82});
  layer.unbindTooltip();layer.bindTooltip(()=>{
   if(self)return 'Origin '+zip+' · within-ZIP stays excluded';
   let msg=(isDest&&origin.value!=='total'?origin.value+' → ':'ZIP ')+zip+
    '<br>'+labels[periodKey]+': '+fmt(rate)+(isExcess?' pp':'%')+
    '<br>July rate: '+fmt(row[0])+'%<br>September: '+fmt(row[1])+'%<br>October: '+fmt(row[2])+'%';
   if(key!=='original'){const pv=v=>v==null?'unavailable':v<0.0001?'&lt;0.0001':v.toPrecision(3);
    msg+='<br>Raw p vs July · September: '+pv(row[5])+', October: '+pv(row[6])+', pooled: '+pv(row[7])}
   return msg
  })
 })
}
if(definitions)definitions.onchange=()=>{periods();period.value=definitions.value==='same_month'?'post':'mean';draw()};if(origin)origin.onchange=draw;
period.onchange=draw;periods();draw();
</script></body></html>
